<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>备电 · 内容数据仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.5/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #1a1e24; --card: #222830; --border: #2a3340;
    --text: #c8cdd4; --muted: #687080; --accent: #C89050;
    --green: #5a9e6e; --red: #c45555; --blue: #4a8eb5;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:1400px; margin:0 auto; padding:24px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  h1 { font-size:22px; font-weight:700; color:#eee; }
  h1 span { color:var(--accent); }
  .btns { display:flex; gap:8px; }
  button, .btn { padding:7px 16px; border:1px solid var(--border); border-radius:6px;
    background:var(--card); color:var(--text); cursor:pointer; font-size:13px; white-space:nowrap; }
  button:hover, .btn:hover { border-color:var(--accent); color:#eee; }
  button.accent { background:var(--accent); border-color:var(--accent); color:#111; font-weight:600; }
  button.accent:hover { opacity:0.9; }
  button.small { padding:4px 10px; font-size:12px; }

  .kpi-row { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:20px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px 16px; text-align:center; }
  .kpi .val { font-size:26px; font-weight:700; color:#eee; }
  .kpi .lbl { font-size:12px; color:var(--muted); margin-top:2px; }

  .main-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; }
  .panel h2 { font-size:15px; margin-bottom:12px; color:#ddd; }
  .panel.wordcloud { grid-column:1; grid-row:1/3; }
  .wordcloud-wrap { width:100%; height:420px; position:relative; overflow-y:auto; }
  .wc-word:hover { transform:scale(1.15)!important; z-index:5; }
  .chart-wrap { width:100%; height:220px; position:relative; }
  .chart-wrap.tall { height:300px; }

  .table-panel { margin-bottom:20px; }
  .table-panel h2 { font-size:15px; margin-bottom:10px; color:#ddd; }
  .filter-row { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .filter-row select, .filter-row input { padding:6px 10px; background:var(--bg); border:1px solid var(--border);
    border-radius:4px; color:var(--text); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; padding:8px 10px; border-bottom:2px solid var(--border); color:var(--muted); font-weight:600; cursor:pointer; }
  th:hover { color:#ddd; }
  td { padding:7px 10px; border-bottom:1px solid var(--border); }
  tr:hover td { background:rgba(255,255,255,0.03); }
  tr.selected td { background:rgba(200,144,80,0.12); }
  .clickable { cursor:pointer; color:var(--blue); }
  .clickable:hover { text-decoration:underline; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:24px; width:520px; max-height:80vh; overflow-y:auto; }
  .modal h3 { margin-bottom:16px; color:#eee; }
  .form-row { margin-bottom:12px; }
  .form-row label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .form-row input, .form-row select, .form-row textarea { width:100%; padding:8px 10px; background:var(--bg);
    border:1px solid var(--border); border-radius:4px; color:var(--text); font-size:13px; }
  .form-row textarea { resize:vertical; min-height:60px; }
  .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }

  .tooltip-box { position:absolute; background:#111; border:1px solid var(--accent); border-radius:6px;
    padding:10px 14px; font-size:12px; line-height:1.6; pointer-events:none; z-index:50; display:none;
    max-width:260px; box-shadow:0 4px 16px rgba(0,0,0,0.5); }

  @media (max-width:900px) { .main-grid { grid-template-columns:1fr; } .kpi-row { grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>备电 · <span>内容数据仪表盘</span></h1>
  <div class="btns">
    <button onclick="openAddPost()">+ 添加内容</button>
    <button onclick="exportJSON()">导出</button>
    <button onclick="document.getElementById('importFile').click()">导入</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
  </div>
</header>

<div class="kpi-row" id="kpiRow"></div>

<div class="main-grid">
  <div class="panel wordcloud">
    <h2>关键词云 <span style="font-weight:400;font-size:12px;color:var(--muted)">— 大小=播放覆盖 · 颜色=互动效果 · 点击筛选</span>
      <span style="float:right;font-size:11px;font-weight:400;">
        <span style="color:#5a9e6e">● 好词</span>
        <span style="color:#687080;margin-left:8px">● 正常</span>
        <span style="color:#c45555;margin-left:8px">● 差词</span>
      </span>
    </h2>
    <div class="wordcloud-wrap" id="wordcloudDiv" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:8px 12px;padding:10px;overflow-y:auto;height:385px;"></div>
    <div class="tooltip-box" id="wcTooltip"></div>
  </div>
  <div class="panel">
    <h2>按内容类型 · 效果对比</h2>
    <div class="chart-wrap tall"><canvas id="chartType"></canvas></div>
  </div>
  <div class="panel">
    <h2>选题方向 TOP10 <span style="font-weight:400;font-size:12px;color:var(--muted)">— 按均互动率</span></h2>
    <div class="chart-wrap tall"><canvas id="chartTopic"></canvas></div>
  </div>
</div>

<div class="main-grid" style="grid-template-columns:1fr 1fr;">
  <div class="panel">
    <h2>目标人群 · 雷达</h2>
    <div class="chart-wrap tall"><canvas id="chartAudience"></canvas></div>
  </div>
  <div class="panel">
    <h2>单篇增长曲线 <span style="font-weight:400;font-size:12px;color:var(--muted)">— 点击列表中的内容</span></h2>
    <div class="chart-wrap tall"><canvas id="chartGrowth"></canvas></div>
  </div>
</div>

<div class="table-panel panel">
  <h2>内容列表 <span id="listCount" style="font-weight:400;font-size:12px;color:var(--muted)"></span></h2>
  <div class="filter-row">
    <select id="filterType" onchange="renderTable()">
      <option value="">全部类型</option>
    </select>
    <input type="text" id="filterSearch" placeholder="搜索标题/关键词..." oninput="renderTable()">
    <button class="small" onclick="clearFilter()">清除筛选</button>
  </div>
  <div style="overflow-x:auto">
    <table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
  </div>
</div>
</div>

<!-- Add/Edit Post Modal -->
<div class="modal-overlay" id="modalPost" style="display:none">
  <div class="modal">
    <h3 id="modalPostTitle">添加新内容</h3>
    <div class="form-row"><label>标题</label><input id="mfTitle"></div>
    <div class="form-row"><label>内容类型</label><select id="mfType"><option>A型图文</option><option>B型图文</option><option>图文</option><option>短视频</option><option>口播脚本</option><option>清单体口播</option><option>概念图谱</option><option>其他</option></select></div>
    <div class="form-row"><label>选题方向</label><input id="mfTopic"></div>
    <div class="form-row"><label>目标人群（逗号分隔）</label><input id="mfAudience" placeholder="行业同行, 工厂老板"></div>
    <div class="form-row"><label>关键词（逗号分隔）</label><input id="mfKeywords" placeholder="储能, 虚拟电厂, 工商业"></div>
    <div class="form-row"><label>人设</label><input id="mfPersona"></div>
    <div class="form-row"><label>发布日期</label><input type="date" id="mfDate"></div>
    <div class="modal-actions">
      <button onclick="closeModal('modalPost')">取消</button>
      <button class="accent" onclick="savePost()">保存</button>
    </div>
  </div>
</div>

<!-- Fill Metrics Modal -->
<div class="modal-overlay" id="modalMetrics" style="display:none">
  <div class="modal">
    <h3>填充数据 — <span id="metricsPostTitle" style="color:var(--accent)"></span></h3>
    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label>播放量</label><input type="number" id="mmViews" value="0"></div>
      <div><label>点赞</label><input type="number" id="mmLikes" value="0"></div>
      <div><label>评论</label><input type="number" id="mmComments" value="0"></div>
      <div><label>转发</label><input type="number" id="mmShares" value="0"></div>
      <div><label>收藏</label><input type="number" id="mmSaves" value="0"></div>
      <div><label>涨粉</label><input type="number" id="mmFollowers" value="0"></div>
    </div>
    <div class="form-row"><label>记录日期</label><input type="date" id="mmDate"></div>
    <div class="modal-actions">
      <button onclick="closeModal('modalMetrics')">取消</button>
      <button class="accent" onclick="saveMetrics()">保存</button>
    </div>
  </div>
</div>

function initSeed() {
  if (!loadState()) {
    state.posts = SEED_POSTS.map(p => ({...p}));
    state.version = 1;
    state.lastUpdated = new Date().toISOString().split('T')[0];
    saveState();
  }
}

// ── Computations ──
function totalMetric(key) {
  return state.posts.reduce((s, p) => s + (p.metrics[key] || 0), 0);
}

function avgInteraction(post) {
  const m = post.metrics;
  if (!m.views || m.views === 0) return 0;
  return ((m.likes||0) + (m.comments||0)*2 + (m.shares||0)*3 + (m.saves||0)*2) / m.views;
}

function avgInteractionAll() {
  const withViews = state.posts.filter(p => p.metrics.views > 0);
  if (!withViews.length) return 0;
  return withViews.reduce((s, p) => s + avgInteraction(p), 0) / withViews.length;
}

// ── Word Cloud ──
function buildWordCloudData() {
  const kwMap = {};
  state.posts.forEach(p => {
    (p.keywords || []).forEach(kw => {
      if (!kwMap[kw]) kwMap[kw] = { posts: [], totalViews: 0, totalInteraction: 0 };
      kwMap[kw].posts.push(p);
      kwMap[kw].totalViews += p.metrics.views || 0;
      kwMap[kw].totalInteraction += avgInteraction(p);
    });
  });

  const avgInt = avgInteractionAll();
  const words = [];
  Object.entries(kwMap).forEach(([kw, data]) => {
    const hasData = data.totalViews > 0;
    const rawWeight = hasData ? Math.log10(data.totalViews + 1) * 10 : (data.posts.length * 8 + 4);
    const weight = Math.max(rawWeight, 6);
    const intRate = data.posts.length > 0 ? data.totalInteraction / data.posts.length : 0;
    let color = COLORS.gray;
    if (avgInt > 0) {
      const ratio = intRate / avgInt;
      if (ratio > 1.5) color = COLORS.green;
      else if (ratio < 0.5) color = COLORS.red;
    }
    words.push({ word: kw, weight, color, data, hasData });
  });
  return words.sort((a, b) => b.weight - a.weight);
}

function renderWordCloud() {
  const container = document.getElementById('wordcloudDiv');
  if (!container) return;
  const words = buildWordCloudData();
  if (!words.length) { container.innerHTML = '<div style="color:var(--muted)">暂无关键词数据</div>'; return; }

  const maxW = Math.max(...words.map(w => w.weight));
  const minW = Math.min(...words.map(w => w.weight));

  container.innerHTML = words.map(w => {
    // Map weight to font-size range 12px..48px
    const range = maxW - minW || 1;
    const fontSize = Math.round(12 + (w.weight - minW) / range * 36);
    const opacity = 0.6 + (w.weight - minW) / range * 0.4;
    const activeCls = filteredKeyword === w.word ? ' style="outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;"' : '';
    return `<span class="wc-word" data-kw="${escAttr(w.word)}"
      style="font-size:${fontSize}px;color:${w.color};opacity:${opacity.toFixed(2)};cursor:pointer;padding:2px 4px;transition:transform 0.15s;line-height:1.3;"
      onmouseenter="showWcTooltip(event, '${escAttr(w.word)}', ${w.data.posts.length}, ${w.data.totalViews}, ${w.hasData})"
      onmouseleave="hideWcTooltip()"
      onclick="filterByKeyword('${escAttr(w.word)}')"
      ${activeCls}
    >${escHtml(w.word)}</span>`;
  }).join('');
}

function escAttr(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function showWcTooltip(e, word, count, totalViews, hasData) {
  const tip = document.getElementById('wcTooltip');
  tip.innerHTML = `<b>${escHtml(word)}</b><br>${count} 篇内容${hasData ? '<br>总播放 ' + fmtNum(totalViews) : '<br>暂无播放数据'}`;
  tip.style.display = 'block';
  const rect = e.target.getBoundingClientRect();
  const container = document.getElementById('wordcloudDiv').getBoundingClientRect();
  tip.style.left = (rect.left - container.left + rect.width/2) + 'px';
  tip.style.top = (rect.top - container.top - 48) + 'px';
}

function hideWcTooltip() {
  document.getElementById('wcTooltip').style.display = 'none';
}

function filterByKeyword(kw) {
  if (filteredKeyword === kw) {
    filteredKeyword = null;
  } else {
    filteredKeyword = kw;
    document.getElementById('filterSearch').value = '';
    document.getElementById('filterType').value = '';
  }
  renderWordCloud();
  renderTable();
}

// ── Type comparison chart ──
function renderTypeChart() {
  if (charts.type) charts.type.destroy();
  const types = {};
  state.posts.forEach(p => {
    const t = p.contentType || '其他';
    if (!types[t]) types[t] = { views: [], likes: [], saves: [], count: 0 };
    types[t].count++;
    if (p.metrics.views > 0) {
      types[t].views.push(p.metrics.views);
      types[t].likes.push(p.metrics.likes || 0);
      types[t].saves.push(p.metrics.saves || 0);
    }
  });

  const labels = Object.keys(types);
  const avg = (arr) => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;

  const ctx = document.getElementById('chartType').getContext('2d');
  charts.type = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: '均播放', data: labels.map(l => Math.round(avg(types[l].views))), backgroundColor: COLORS.blue, borderRadius: 4 },
        { label: '均赞', data: labels.map(l => Math.round(avg(types[l].likes))), backgroundColor: COLORS.accent, borderRadius: 4 },
        { label: '均收藏', data: labels.map(l => Math.round(avg(types[l].saves))), backgroundColor: COLORS.green, borderRadius: 4 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: COLORS.gray } } },
      scales: {
        x: { ticks: { color: COLORS.muted, maxRotation: 30 }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { ticks: { color: COLORS.muted }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
}

// ── Topic chart ──
function renderTopicChart() {
  if (charts.topic) charts.topic.destroy();
  const topics = {};
  state.posts.forEach(p => {
    const t = p.topic || '(无选题)';
    if (!topics[t]) topics[t] = { posts: [], totalInt: 0 };
    topics[t].posts.push(p);
    topics[t].totalInt += avgInteraction(p);
  });

  const sorted = Object.entries(topics)
    .map(([t, d]) => ({ topic: t.length > 25 ? t.slice(0,22)+'...' : t, rate: d.posts.length ? d.totalInt/d.posts.length : 0, count: d.posts.length }))
    .filter(d => d.count >= 1)
    .sort((a,b) => b.rate - a.rate)
    .slice(0, 10);

  const ctx = document.getElementById('chartTopic').getContext('2d');
  charts.topic = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: sorted.map(d => d.topic),
      datasets: [{
        label: '均互动率', data: sorted.map(d => (d.rate*100).toFixed(1)),
        backgroundColor: sorted.map((_,i) => {
          const t = 1 - i/sorted.length;
          return `rgba(200,144,80,${0.4 + t*0.5})`;
        }),
        borderRadius: 4
      }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: COLORS.muted, callback:v=>v+'%' }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { ticks: { color: COLORS.muted, font:{size:11} }, grid: { color: 'rgba(255,255,255,0.05)' } }
      }
    }
  });
}

// ── Audience radar ──
function renderAudienceChart() {
  if (charts.audience) charts.audience.destroy();
  const audMap = {};
  state.posts.forEach(p => {
    (p.audience || []).forEach(a => {
      if (!audMap[a]) audMap[a] = { count: 0, totalInt: 0 };
      audMap[a].count++;
      audMap[a].totalInt += avgInteraction(p);

  const entries = Object.entries(audMap);

  if (!labels.length) return;

  const ctx = document.getElementById('chartAudience').getContext('2d');
  charts.audience = new Chart(ctx, {
    type: 'radar',
    data: {
      labels,
      datasets: [
        { label: '内容数量', data: counts, borderColor: COLORS.blue, backgroundColor: 'rgba(74,142,181,0.15)', pointBackgroundColor: COLORS.blue },
        { label: '均互动率%', data: rates, borderColor: COLORS.accent, backgroundColor: 'rgba(200,144,80,0.15)', pointBackgroundColor: COLORS.accent }

      responsive: true, maintainAspectRatio: false,

  });
}

// ── Growth chart ──
function renderGrowthChart(postId) {
  if (charts.growth) charts.growth.destroy();
  if (!postId) { return; }
  const post = state.posts.find(p => p.id === postId);
  if (!post || !post.metricHistory || post.metricHistory.length < 2) return;

  const history = [...post.metricHistory].sort((a,b) => a.date.localeCompare(b.date));
  const labels = history.map(h => h.date);
  const ctx = document.getElementById('chartGrowth').getContext('2d');

    type: 'line',

        { label: '收藏', data: history.map(h=>h.saves), borderColor: COLORS.green, tension: 0.3, fill: false }

// ── KPI cards ──
function renderKPIs() {
  const withData = state.posts.filter(p => p.metrics.views > 0);
  const html = [
    { val: state.posts.length, lbl: '总内容数' },
    { val: withData.length, lbl: '有数据内容' },
    { val: fmtNum(totalMetric('views')), lbl: '总播放' },
    { val: fmtNum(totalMetric('likes')), lbl: '总点赞' },
    { val: fmtNum(totalMetric('saves')), lbl: '总收藏' },
    { val: (avgInteractionAll()*100).toFixed(1) + '%', lbl: '均互动率' }
  ].map(k => `<div class="kpi"><div class="val">${k.val}</div><div class="lbl">${k.lbl}</div></div>`).join('');
  document.getElementById('kpiRow').innerHTML = html;
}

function fmtNum(n) {
  if (n >= 10000) return (n/10000).toFixed(1) + '万';
  if (n >= 1000) return (n/1000).toFixed(1) + 'k';
  return n.toString();
}

// ── Table ──
function renderTable() {
  const typeFilter = document.getElementById('filterType').value;
  const search = document.getElementById('filterSearch').value.toLowerCase();

  let posts = [...state.posts];
  if (filteredKeyword) {
    posts = posts.filter(p => (p.keywords || []).includes(filteredKeyword));
  }
  if (typeFilter) {
    posts = posts.filter(p => p.contentType === typeFilter);
  }
  if (search) {
    posts = posts.filter(p =>
      p.title.toLowerCase().includes(search) ||
      (p.keywords||[]).some(k => k.toLowerCase().includes(search)) ||
      (p.topic||'').toLowerCase().includes(search)
    );
  }

  // Sort
  if (sortCol) {
    posts.sort((a,b) => {
      let va, vb;
      switch(sortCol) {
        case 'title': va = a.title; vb = b.title; break;
        case 'type': va = a.contentType; vb = b.contentType; break;
        case 'date': va = a.publishedDate; vb = b.publishedDate; break;
        case 'views': va = a.metrics.views||0; vb = b.metrics.views||0; break;
        case 'likes': va = a.metrics.likes||0; vb = b.metrics.likes||0; break;
        case 'comments': va = a.metrics.comments||0; vb = b.metrics.comments||0; break;
        case 'shares': va = a.metrics.shares||0; vb = b.metrics.shares||0; break;
        case 'saves': va = a.metrics.saves||0; vb = b.metrics.saves||0; break;
        default: return 0;
      }
      if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
      return (va - vb) * sortDir;
    });
  }

  document.getElementById('listCount').textContent = `(${posts.length}篇)`;

  const headHtml = `<tr>
    <th onclick="setSort('title')">标题 ${sortCol==='title'?(sortDir>0?'▲':'▼'):''}</th>
    <th onclick="setSort('type')">类型 ${sortCol==='type'?(sortDir>0?'▲':'▼'):''}</th>
    <th>关键词</th>
    <th onclick="setSort('date')">日期 ${sortCol==='date'?(sortDir>0?'▲':'▼'):''}</th>
    <th onclick="setSort('views')">播放 ${sortCol==='views'?(sortDir>0?'▲':'▼'):''}</th>
    <th onclick="setSort('likes')">赞 ${sortCol==='likes'?(sortDir>0?'▲':'▼'):''}</th>
    <th onclick="setSort('comments')">评 ${sortCol==='comments'?(sortDir>0?'▲':'▼'):''}</th>
    <th onclick="setSort('shares')">转发 ${sortCol==='shares'?(sortDir>0?'▲':'▼'):''}</th>
    <th onclick="setSort('saves')">收藏 ${sortCol==='saves'?(sortDir>0?'▲':'▼'):''}</th>
    <th>操作</th>
  </tr>`;
  document.getElementById('tableHead').innerHTML = headHtml;

  const bodyHtml = posts.map(p => {
    const kws = (p.keywords||[]).slice(0,3).join(' ');
    const cls = selectedPostId === p.id ? 'selected' : '';
    return `<tr class="${cls}" onclick="selectPost('${p.id}')">
      <td class="clickable">${escHtml(p.title.slice(0,40))}</td>
      <td>${p.contentType}</td>
      <td style="font-size:12px;color:var(--muted)">${escHtml(kws)}</td>
      <td style="font-size:12px">${p.publishedDate}</td>
      <td>${fmtNum(p.metrics.views)}</td>
      <td>${fmtNum(p.metrics.likes)}</td>
      <td>${p.metrics.comments||0}</td>
      <td>${p.metrics.shares||0}</td>
      <td>${fmtNum(p.metrics.saves)}</td>
      <td><button class="small" onclick="event.stopPropagation();openFillMetrics('${p.id}')">填数据</button></td>
    </tr>`;
  }).join('');
  document.getElementById('tableBody').innerHTML = bodyHtml || '<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:30px;">暂无内容</td></tr>';
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function setSort(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = -1; }
  renderTable();
}

function clearFilter() {
  filteredKeyword = null;
  document.getElementById('filterSearch').value = '';
  document.getElementById('filterType').value = '';
  renderWordCloud();
  renderTable();
}

function selectPost(id) {
  selectedPostId = id;
  renderTable();
  renderGrowthChart(id);
}

// ── Modals ──
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function openAddPost() {
  document.getElementById('modalPostTitle').textContent = '添加新内容';
  ['mfTitle','mfTopic','mfAudience','mfKeywords','mfPersona'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('mfDate').value = new Date().toISOString().split('T')[0];
  openModal('modalPost');
}

function savePost() {
  const post = {
    id: 'post-' + Date.now(),
    title: document.getElementById('mfTitle').value || '未命名',
    contentType: document.getElementById('mfType').value,
    topic: document.getElementById('mfTopic').value,
    audience: document.getElementById('mfAudience').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean),
    keywords: document.getElementById('mfKeywords').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean),
    tags: { L1: [], L2: [], L3: [] },
    persona: document.getElementById('mfPersona').value,
    publishedDate: document.getElementById('mfDate').value,
    metrics: { views: 0, likes: 0, comments: 0, shares: 0, saves: 0, followers: 0 },
    metricHistory: []
  };
  state.posts.unshift(post);
  saveState();
  closeModal('modalPost');
  refreshAll();
}

function openFillMetrics(id) {
  const post = state.posts.find(p => p.id === id);
  if (!post) return;
  selectedPostId = id;
  document.getElementById('metricsPostTitle').textContent = post.title;
  document.getElementById('mmViews').value = post.metrics.views || 0;
  document.getElementById('mmLikes').value = post.metrics.likes || 0;
  document.getElementById('mmComments').value = post.metrics.comments || 0;
  document.getElementById('mmShares').value = post.metrics.shares || 0;
  document.getElementById('mmSaves').value = post.metrics.saves || 0;
  document.getElementById('mmFollowers').value = post.metrics.followers || 0;
  document.getElementById('mmDate').value = new Date().toISOString().split('T')[0];
  openModal('modalMetrics');
}

function saveMetrics() {
  const post = state.posts.find(p => p.id === selectedPostId);
  if (!post) return;
  const date = document.getElementById('mmDate').value;
  const entry = {
    date,
    views: parseInt(document.getElementById('mmViews').value) || 0,
    likes: parseInt(document.getElementById('mmLikes').value) || 0,
    comments: parseInt(document.getElementById('mmComments').value) || 0,
    shares: parseInt(document.getElementById('mmShares').value) || 0,
    saves: parseInt(document.getElementById('mmSaves').value) || 0,
    followers: parseInt(document.getElementById('mmFollowers').value) || 0
  };
  // Update current metrics to latest
  Object.assign(post.metrics, entry);
  // Add/update history entry
  const existingIdx = (post.metricHistory || []).findIndex(h => h.date === date);
  if (existingIdx >= 0) {
    post.metricHistory[existingIdx] = entry;
  } else {
    post.metricHistory.push(entry);
  }
  state.lastUpdated = new Date().toISOString().split('T')[0];
  saveState();
  closeModal('modalMetrics');
  refreshAll();
}

// ── Export/Import ──
function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `beidian-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
}

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.posts || !Array.isArray(data.posts)) throw new Error('Invalid format');
      state = data;
      state.version = state.version || 1;
      saveState();
      refreshAll();
      alert(`导入成功：${data.posts.length} 篇内容`);
    } catch(err) {
      alert('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ── Init ──
function refreshAll() {
  renderKPIs();
  renderWordCloud();
  renderTypeChart();
  renderTopicChart();
  renderAudienceChart();
  renderGrowthChart(selectedPostId);
  renderTable();
  // Update filter dropdown
  const sel = document.getElementById('filterType');
  sel.innerHTML = '<option value="">全部类型</option>' + CONTENT_TYPES.map(t => `<option>${t}</option>`).join('');
}

initSeed();
refreshAll();
</script>
